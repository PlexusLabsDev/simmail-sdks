# Publishes simmail to PyPI when a tag py-vX.Y.Z is pushed.
# PyPI trusted publishing (OIDC): no API token is stored anywhere; the PyPI
# project names this repository, workflow file and environment instead.
name: release-python
on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag matches pyproject.toml
        run: test "py-v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - run: PYTHONPATH=. python -m unittest discover -s tests
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
