[project]
name = "simmail"
version = "0.1.0"
description = "Client for simmail: wait for the email your app sends, pull out codes and links, and get replies from simulated people."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
