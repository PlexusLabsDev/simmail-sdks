[project]
name = "simmail"
version = "0.1.0"
description = "Client for simmail: wait for the email your app sends, pull out codes and links, and get replies from simulated people."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Plexus Labs" }]
keywords = ["email", "testing", "smtp", "e2e", "pytest", "simmail", "email-testing", "magic-link", "otp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.simmail.dev"
Documentation = "https://www.simmail.dev/docs/"
Source = "https://github.com/plexuslabs/simmail-sdks"
Issues = "https://github.com/plexuslabs/simmail-sdks/issues"
Changelog = "https://github.com/plexuslabs/simmail-sdks/blob/main/python/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simmail"]

[tool.hatch.build.targets.sdist]
include = ["simmail", "tests", "README.md", "CHANGELOG.md", "LICENSE"]
